[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testcase-agent"
version = "0.1.0"
description = "AI-powered agent that analyzes source code and requirements to generate structured test cases"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Veerkumar Patil" }]
keywords = ["testing", "test-generation", "qa", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
testcase-agent = "testcase_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testcase_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["testcase_agent"]
